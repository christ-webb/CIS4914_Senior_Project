[project]
name = "no-more-500s-api"
version = "0.1.0"
description = "Trace ingestion and query API for No More 500s"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect>=0.8,<1",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/no_more_500s_api"]
