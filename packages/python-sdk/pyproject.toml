[project]
name = "no-more-500s"
version = "0.1.0"
description = "Python instrumentation SDK for No More 500s"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "opentelemetry-api>=1.27,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomore500s"]

