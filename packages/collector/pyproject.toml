[project]
name = "no-more-500s-collector"
version = "0.1.0"
description = "External coding-agent collectors for No More 500s"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
nm5-collector = "nomore500s_collector.cli:collector_main"
nm5-codex-hook = "nomore500s_collector.cli:hook_main"
nm5-codex-install-hooks = "nomore500s_collector.cli:install_main"
nm5-codex-uninstall-hooks = "nomore500s_collector.cli:uninstall_main"
nm5-cursor-hook = "nomore500s_collector.cli:cursor_hook_main"
nm5-cursor-install-hooks = "nomore500s_collector.cli:cursor_install_main"
nm5-cursor-uninstall-hooks = "nomore500s_collector.cli:cursor_uninstall_main"
nm5-vscode-hook = "nomore500s_collector.cli:vscode_hook_main"
nm5-vscode-install-hooks = "nomore500s_collector.cli:vscode_install_main"
nm5-vscode-uninstall-hooks = "nomore500s_collector.cli:vscode_uninstall_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomore500s_collector"]
