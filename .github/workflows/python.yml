name: Python

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --dev
      - run: uv run ruff check .
      - run: uv run mypy apps/api/src packages/python-sdk/src
      - run: uv run pytest
      - run: docker compose up -d --wait clickhouse
      - run: NM5_TEST_CLICKHOUSE=1 NM5_CLICKHOUSE_PASSWORD=nomore500s uv run pytest apps/api/tests/test_clickhouse_repository.py
